# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

## Toolchain / loader plugins (Architectury multi-loader for MC 1.20.1)
architectury_plugin_version=3.4-SNAPSHOT
architectury_loom_version=1.9-SNAPSHOT
enabled_platforms=fabric,forge

## Minecraft / mappings
## MC 1.20.1 targets Java 17.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
parchment_version=2023.09.03

## Architectury API (9.x is the 1.20.1 line)
architectury_api_version=9.2.14

## Fabric
fabric_loader_version=0.16.10
fabric_api_version=0.92.2+1.20.1

## Forge
forge_version=47.1.0
forge_version_range=[47,)
loader_version_range=[47,)

## Mod metadata
mod_id=shw
archives_name=set-home-waypoints
mod_version=1.1.0
maven_group=com.dodgeman.shw
mod_name=Set Home & Waypoints
mod_author=DodgeMan_
mod_license=All Rights Reserved
mod_description=Set Home & Waypoints allows players to set a home and waypoints. The development was focused on user experience (autocomplete, key bind, command feedback, colors...).

## Resources
## MC 1.20.1 resource pack format
pack_format=15

## Cross-loader TOML config backend (matches the version Forge 1.20.1 bundles)
nightconfig_version=3.6.6
