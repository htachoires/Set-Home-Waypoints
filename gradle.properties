# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

## Toolchain / loader plugins (verified 2026-10 for MC 26.3)
architectury_plugin_version=3.5.170
architectury_loom_version=1.17.493
enabled_platforms=fabric,neoforge

## Minecraft / mappings
## MC moved to year-based versioning in 2026 (YY.D.H).
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

## Architectury API
architectury_api_version=22.0.5

## Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.165.0+26.3

## NeoForge
neoforge_version=26.3.0.99
neoforge_loader_version_range=[4,)

## Mod metadata
mod_id=shw
archives_name=set-home-waypoints
mod_version=2.1.0
maven_group=com.dodgeman.shw
mod_name=Set Home & Waypoints
mod_author=DodgeMan_
mod_license=All Rights Reserved
mod_description=Set Home & Waypoints allows players to set a home and waypoints. The development was focused on user experience (autocomplete, key bind, command feedback, colors...).

## Resources
## MC 26.3 resource pack format (data pack format is 121; pack.mcmeta uses min_format/max_format)
pack_format=97

## Cross-loader TOML config backend
nightconfig_version=3.8.1
