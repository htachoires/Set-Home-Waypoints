plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")

    // Forge already bundles NightConfig (used by ForgeConfigSpec) -> compileOnly, do NOT include.
    compileOnly "com.electronwill.night-config:core:${rootProject.nightconfig_version}"
    compileOnly "com.electronwill.night-config:toml:${rootProject.nightconfig_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_range", rootProject.minecraft_version_range
    inputs.property "forge_range", rootProject.forge_version_range
    inputs.property "loader_range", rootProject.loader_version_range

    def props = [
            version                : project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            forge_version_range    : rootProject.forge_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_license            : rootProject.mod_license,
            mod_author             : rootProject.mod_author,
            mod_description        : rootProject.mod_description,
            architectury_api_version: rootProject.architectury_api_version
    ]
    inputs.properties props
    filesMatching("META-INF/mods.toml") {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = null
    dependsOn shadowJar
}
