plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    // loom-no-remap does not remap, so the "mod" configuration prefixes are gone.
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    // The "namedElements" configuration no longer exists under loom-no-remap.
    common(project(path: ":common")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    // NeoForge already bundles NightConfig (used by ModConfigSpec) -> compileOnly, do NOT include.
    compileOnly "com.electronwill.night-config:core:${rootProject.nightconfig_version}"
    compileOnly "com.electronwill.night-config:toml:${rootProject.nightconfig_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_range", rootProject.minecraft_version_range
    inputs.property "nf_range", rootProject.neoforge_loader_version_range

    def props = [
            version                      : project.version,
            minecraft_version_range      : rootProject.minecraft_version_range,
            neoforge_version             : rootProject.neoforge_version,
            neoforge_loader_version_range: rootProject.neoforge_loader_version_range,
            mod_id                       : rootProject.mod_id,
            mod_name                     : rootProject.mod_name,
            mod_license                  : rootProject.mod_license,
            mod_author                   : rootProject.mod_author,
            mod_description              : rootProject.mod_description,
            architectury_api_version     : rootProject.architectury_api_version
    ]
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

// loom-no-remap has no remapJar. shadowJar is used only as an intermediate step to gather the
// transformed common classes; the real `jar` task then unpacks that on top of the NeoForge
// sources (mirroring the old remapJar(shadowJar) flow). NeoForge uses access transformers rather
// than access wideners; this mod ships neither, so no AW->AT conversion is needed.
shadowJar {
    mainSpec.sourcePaths.clear()
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

jar {
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(shadowJar.archiveFile))
    from rootProject.file("LICENSE.txt")
}
